apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personal-net
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      try_files $uri $uri/ /index.html;
spec:
  rules:
    - host: strbagus.my.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: personal-web
                port:
                  number: 80
          - path: /n8n
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: uniauth-api
                port:
                  number: 8082
          - path: /api/gallery
            pathType: Prefix
            backend:
              service:
                name: hl-gallery-api
                port:
                  number: 8083
          - path: /api/metrics
            pathType: Prefix
            backend:
              service:
                name: hl-metrics-api
                port:
                  number: 8091

